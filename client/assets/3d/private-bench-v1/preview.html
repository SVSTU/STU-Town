<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../../../"><title>Asset vườn ghế riêng</title><style>body{margin:0;color:#1c392b;background:#e9e7dc;font:16px system-ui}header{position:absolute;z-index:2;background:#fffffff0;border-radius:0 0 15px 0;max-width:290px;padding:18px}h1{font-size:22px}select{padding:8px;width:100%}p{font-size:13px;line-height:1.5}a{display:block;color:#285873;margin:12px 0}canvas{display:block;width:100vw;height:100vh;touch-action:none}</style></head><body><header><h1>Asset vườn ghế riêng</h1><label>Chọn đối tượng<select id="asset"></select></label><p id="details">Đang tải…</p><a href="assets/3d/characters/private-garden-v1/preview.html">Thử mô-đun nhân vật</a><a href="../tools/private-bench-smoke.html">Xem map đã ghép</a></header><canvas id="preview"></canvas><script src="https://cdn.babylonjs.com/babylon.js"></script><script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script><script>
const names={'pergola':'Chòi dây leo','bench':'Ghế đôi','tree':'Cây bóng mát','lamp':'Đèn sân vườn','flower-urn':'Chậu hoa có đế','flowerbed':'Bồn hoa tròn','hedge':'Hàng rào cây','exit-portal':'Cổng xoáy','paving':'Đường lát','garden-ground':'Nền và lối đi'};
const engine=new BABYLON.Engine(document.getElementById('preview'),true),scene=new BABYLON.Scene(engine);scene.clearColor=new BABYLON.Color4(.87,.88,.82,1);
const camera=new BABYLON.ArcRotateCamera('camera',-Math.PI/2+.25,1.03,7,new BABYLON.Vector3(0,1,0),scene);camera.attachControl(engine.getRenderingCanvas(),true);camera.lowerRadiusLimit=.6;camera.upperRadiusLimit=35;new BABYLON.HemisphericLight('light',new BABYLON.Vector3(-.3,1,-.4),scene);
let container,root,request=0;async function selectAsset(asset){const token=++request,next=await BABYLON.SceneLoader.LoadAssetContainerAsync('assets/3d/private-bench-v1/',asset.file,scene);if(token!==request){next.dispose();return;}root?.dispose();container?.dispose();container=next;container.addAllToScene();root=new BABYLON.TransformNode('asset-orientation',scene);root.rotation.y=Math.PI;container.meshes.filter(m=>!m.parent).forEach(m=>m.parent=root);root.computeWorldMatrix(true);const b=root.getHierarchyBoundingVectors(true),size=b.max.subtract(b.min);camera.setTarget(b.max.add(b.min).scale(.5));camera.radius=Math.max(size.x,size.y,size.z)*1.8;document.getElementById('details').textContent=names[asset.id]+' · '+(asset.bytes/1024).toFixed(0)+' KB · GLB PBR · mét. Kéo để xoay, cuộn hoặc chụm để zoom.';window.assetPreview={scene,root,asset};}
fetch('assets/3d/private-bench-v1/manifest.json').then(r=>r.json()).then(data=>{const select=document.getElementById('asset');for(const a of data.assets){const o=document.createElement('option');o.value=a.id;o.textContent=names[a.id];select.appendChild(o);}select.onchange=()=>selectAsset(data.assets.find(a=>a.id===select.value));select.value='bench';selectAsset(data.assets.find(a=>a.id==='bench'));});window.addEventListener('resize',()=>engine.resize());engine.runRenderLoop(()=>scene.render());
</script></body></html>
