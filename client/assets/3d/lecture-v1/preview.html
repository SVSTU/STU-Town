<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../../../"><title>Asset Khu C · STU Town</title><style>body{margin:0;background:#e9e4d8;color:#29372e;font:16px system-ui}header{position:absolute;z-index:2;max-width:330px;padding:18px;background:#fffffff0;border-radius:0 0 15px 0}h1{font-size:22px;margin:0 0 10px}select{padding:8px;width:100%}a{display:block;margin:12px 0;color:#345b87}p{font-size:13px;line-height:1.5}canvas{display:block;width:100vw;height:100vh;touch-action:none}</style></head><body><header><h1>Asset Khu C</h1><select id="asset" aria-label="Chọn đối tượng"></select><p id="details">Đang tải danh mục…</p><a href="assets/3d/characters/campus-v1/preview.html">Thử module nhân vật</a><a href="../tools/map3d-smoke.html?map=khu-c">Xem map đã ghép</a><a href="assets/3d/lecture-v1/previews/assembled-isometric.png">Render từ mesh thật</a></header><canvas id="preview"></canvas><script src="https://cdn.babylonjs.com/babylon.js"></script><script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script><script>
const engine=new BABYLON.Engine(document.getElementById('preview'),true),scene=new BABYLON.Scene(engine);scene.clearColor=new BABYLON.Color4(.85,.87,.82,1);
const camera=new BABYLON.ArcRotateCamera('camera',-Math.PI/2,1.10,7,new BABYLON.Vector3(0,1,0),scene);camera.attachControl(engine.getRenderingCanvas(),true);camera.lowerRadiusLimit=.8;camera.upperRadiusLimit=15;new BABYLON.HemisphericLight('light',new BABYLON.Vector3(-.3,1,-.3),scene);
let container,previewRoot,request=0;async function selectAsset(asset){const token=++request;document.getElementById('details').textContent='Đang tải '+asset.id+'…';const next=await BABYLON.SceneLoader.LoadAssetContainerAsync('assets/3d/lecture-v1/',asset.file,scene);if(token!==request){next.dispose();return;}previewRoot?.dispose();container?.dispose();container=next;container.addAllToScene();const imported=container.meshes.find(m=>!m.parent),root=new BABYLON.TransformNode('asset-orientation',scene);previewRoot=root;imported.parent=root;root.rotation.y=Math.PI;root.computeWorldMatrix(true);const bounds=root.getHierarchyBoundingVectors(true),center=bounds.min.add(bounds.max).scale(.5),size=bounds.max.subtract(bounds.min);camera.setTarget(center);camera.radius=Math.max(size.x,size.y,size.z)*1.8;document.getElementById('details').textContent=asset.id+' · '+(asset.bytes/1024).toFixed(0)+' KB · mét · GLB PBR. Kéo để xoay, cuộn/chụm để zoom.';window.assetPreview={scene,root,asset};}
fetch('assets/3d/lecture-v1/manifest.json').then(r=>r.json()).then(manifest=>{const select=document.getElementById('asset');for(const asset of manifest.assets){const option=document.createElement('option');option.value=asset.id;option.textContent=asset.id;select.appendChild(option);}select.addEventListener('change',()=>selectAsset(manifest.assets.find(a=>a.id===select.value)));selectAsset(manifest.assets.find(a=>a.id==='student-desk'));select.value='student-desk';});window.addEventListener('resize',()=>engine.resize());engine.runRenderLoop(()=>scene.render());
</script></body></html>
