<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../../../../"><title>Mô-đun sinh viên · Vườn ghế riêng</title><style>body{margin:0;background:#e6eadf;color:#183b2b;font:15px system-ui}header{position:absolute;z-index:2;max-width:270px;padding:16px;background:#fffffff0;border-radius:0 0 14px 0}h1{font-size:20px}label{display:block;margin:10px 0}select{padding:8px;width:100%}canvas{display:block;width:100vw;height:100vh;touch-action:none}p{font-size:12px;line-height:1.5}a{color:#295a7b}</style></head><body><header><h1>Nhân vật mô-đun</h1><label>Tóc<select id="hair"><option value="wavy">Tóc ngắn</option><option value="braid">Tóc tết</option><option value="gray">Tóc bạc</option></select></label><label>Trang phục<select id="outfit"><option value="polo">Áo polo</option><option value="apron">Tạp dề</option><option value="vest">Áo ghi lê</option></select></label><label><input id="backpack" type="checkbox"> Ba lô</label><label><input id="glasses" type="checkbox"> Kính</label><label>Chuyển động<select id="pose"><option value="idle">Đứng</option><option value="walk">Đi bộ</option><option value="sit">Ngồi</option></select></label><p>Tóc, áo và phụ kiện có thể thay riêng, dùng chung khớp chuyển động. Trang kiểm tra asset; lựa chọn chưa lưu vào hồ sơ người chơi.</p><a href="../tools/private-bench-smoke.html">Xem map ghế riêng</a><p id="status">Đang tải…</p></header><canvas id="preview"></canvas>
<script src="https://cdn.babylonjs.com/babylon.js"></script><script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script><script src="character-assets.js"></script><script src="student-animation.js"></script><script>
const engine=new BABYLON.Engine(document.getElementById('preview'),true),scene=new BABYLON.Scene(engine);scene.clearColor=new BABYLON.Color4(.87,.90,.83,1);
const camera=new BABYLON.ArcRotateCamera('camera',-Math.PI/2,1.26,3.8,new BABYLON.Vector3(0,.85,0),scene);camera.attachControl(engine.getRenderingCanvas(),true);camera.lowerRadiusLimit=1.8;camera.upperRadiusLimit=6;
new BABYLON.HemisphericLight('light',new BABYLON.Vector3(-.3,1,-.4),scene);
let model,animate;const characterRoot=new BABYLON.TransformNode('character',scene);
function apply(){if(model)CharacterAssets.applyModules(model,{hair:document.getElementById('hair').value,outfit:document.getElementById('outfit').value,accessories:['backpack','glasses'].filter(id=>document.getElementById(id).checked)});}
BABYLON.SceneLoader.ImportMeshAsync('','assets/3d/characters/private-garden-v1/','modular-student.glb',scene).then(asset=>{model=asset.meshes.find(m=>!m.parent);model.parent=characterRoot;characterRoot.rotation.y=Math.PI;animate=bindStudentAnimation(characterRoot,model);apply();window.modulePreview={scene,model,apply,characterRoot};document.getElementById('status').textContent='Đã tải · 8 khớp chuyển động · đơn vị mét';});
document.querySelectorAll('select,input').forEach(el=>el.addEventListener('change',apply));window.addEventListener('resize',()=>engine.resize());engine.runRenderLoop(()=>{const dt=Math.min(engine.getDeltaTime()/1000,.05),pose=document.getElementById('pose').value;if(animate){animate(dt,pose==='walk'?dt*1.5:0,pose==='walk',pose==='sit');if(pose==='sit')characterRoot.position.y=.46-.69;}scene.render();});
</script></body></html>
