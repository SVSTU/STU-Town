<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../../../../"><title>Nhân vật module · STU Town</title><style>body{margin:0;background:#eef0e7;color:#21382c;font:16px system-ui}header{position:absolute;z-index:2;padding:18px;background:#fffffff0;border-radius:0 0 16px 0;max-width:310px}h1{font-size:21px;margin:0 0 12px}label{display:block;margin:10px 0}select{padding:7px;width:100%}canvas{width:100vw;height:100vh;display:block;touch-action:none}a{color:#345b87}p{font-size:13px;line-height:1.5}</style></head><body><header><h1>Nhân vật module</h1><label>Tóc<select id="hair"><option value="wavy">Tóc ngắn</option><option value="braid">Tóc tết</option><option value="gray">Tóc bạc</option></select></label><label>Trang phục<select id="outfit"><option value="polo">Áo polo</option><option value="apron">Tạp dề</option><option value="vest">Áo ghi lê</option></select></label><label><input id="backpack" type="checkbox" checked> Ba lô</label><label><input id="glasses" type="checkbox"> Kính</label><label><input id="walk" type="checkbox"> Xem chuyển động</label><p>Tất cả tổ hợp dùng chung khớp chuyển động. Đây là trang kiểm tra asset; lựa chọn chưa lưu vào hồ sơ người chơi.</p><a href="../tools/map3d-smoke.html?map=khu-a">Xem Khu A</a><p id="status">Đang tải mô hình…</p></header><canvas id="preview"></canvas><script src="https://cdn.babylonjs.com/babylon.js"></script><script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script><script src="character-assets.js"></script><script src="student-animation.js"></script><script>
const engine=new BABYLON.Engine(document.getElementById('preview'),true),scene=new BABYLON.Scene(engine);scene.clearColor=new BABYLON.Color4(.88,.90,.85,1);
const camera=new BABYLON.ArcRotateCamera('camera',-Math.PI/2,1.18,3.8,new BABYLON.Vector3(0,.9,0),scene);camera.attachControl(engine.getRenderingCanvas(),true);camera.lowerRadiusLimit=2;camera.upperRadiusLimit=6;
new BABYLON.HemisphericLight('light',new BABYLON.Vector3(0,1,-.4),scene);
let model,animate;const characterRoot=new BABYLON.TransformNode('character',scene);
function apply(){if(!model)return;CharacterAssets.applyModules(model,{hair:document.getElementById('hair').value,outfit:document.getElementById('outfit').value,accessories:['backpack','glasses'].filter(id=>document.getElementById(id).checked)});}
BABYLON.SceneLoader.ImportMeshAsync('','assets/3d/characters/coop-v1/','modular-human.glb',scene).then(asset=>{model=asset.meshes.find(m=>!m.parent);model.parent=characterRoot;characterRoot.rotation.y=Math.PI;animate=bindStudentAnimation(characterRoot,model);apply();document.getElementById('status').textContent='Đã tải · mét · chung 8 khớp chuyển động';window.modulePreview={scene,model,apply,characterRoot};});
document.querySelectorAll('select,input').forEach(el=>el.addEventListener('change',apply));window.addEventListener('resize',()=>engine.resize());engine.runRenderLoop(()=>{const dt=Math.min(engine.getDeltaTime()/1000,.05),walking=document.getElementById('walk').checked;if(animate)animate(dt,walking?dt*1.6:0,walking,false);scene.render();});
</script></body></html>
