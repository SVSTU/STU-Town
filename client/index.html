<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STU-Town</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { margin: 0; background: #1a1a1a; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        canvas { border: 2px solid #555; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
<script>
    console.log("GAME STARTING...");
    const socket = io("https://stu-town-server.onrender.com");

    let players = {};
    let myId = null;
    let clickTarget = null;
    let cursors, wasd;
    let sceneRef = null;

    const config = {
        type: Phaser.AUTO,
        width: 800,
        height: 600,
        backgroundColor: '#2d2d2d',
        scene: { preload: preload, create: create, update: update }
    };

    const game = new Phaser.Game(config);

    function preload() {}

    function create() {
        sceneRef = this;
        console.log("SCENE CREATED SUCCESSFULLY!");

        cursors = sceneRef.input.keyboard.createCursorKeys();
        wasd = sceneRef.input.keyboard.addKeys({
            up: Phaser.Input.Keyboard.KeyCodes.W,
            down: Phaser.Input.Keyboard.KeyCodes.S,
            left: Phaser.Input.Keyboard.KeyCodes.A,
            right: Phaser.Input.Keyboard.KeyCodes.D
        });

        sceneRef.input.on('pointerdown', (pointer) => {
            clickTarget = { x: pointer.x, y: pointer.y };
        });

        socket.on('connect', () => {
            myId = socket.id;
            console.log("Connected to server, my ID:", myId);
        });

        socket.on('currentPlayers', (serverPlayers) => {
            Object.keys(serverPlayers).forEach((id) => {
                if (!players[id]) {
                    createPlayer(sceneRef, serverPlayers[id], id);
                }
            });
        });

        socket.on('newPlayer', (playerInfo) => {
            if (!players[playerInfo.id]) {
                createPlayer(sceneRef, playerInfo, playerInfo.id);
            }
        });

        // Đồng bộ vị trí của người chơi khác
        socket.on('playerMoved', (playerInfo) => {
            if (players[playerInfo.id]) {
                players[playerInfo.id].x = playerInfo.x;
                players[playerInfo.id].y = playerInfo.y;
                if (players[playerInfo.id].textLabel) {
                    players[playerInfo.id].textLabel.x = playerInfo.x;
                    players[playerInfo.id].textLabel.y = playerInfo.y - 25;
                }
            }
        });

        socket.on('playerDisconnected', (id) => {
            if (players[id]) {
                if (players[id].textLabel) players[id].textLabel.destroy();
                players[id].destroy();
                delete players[id];
            }
        });
    }

    function createPlayer(scene, info, id) {
        const isMe = (id === socket.id);
        const color = isMe ? 0x00ff55 : 0xff5500;
        const radius = isMe ? 15 : 12;

        const circle = scene.add.circle(info.x, info.y, radius, color);
        
        const labelText = isMe ? "Bạn" : "Khách";
        const text = scene.add.text(info.x, info.y - 25, labelText, {
            font: '14px Arial',
            fill: '#ffffff',
            backgroundColor: '#00000088',
            padding: { x: 4, y: 2 }
        }).setOrigin(0.5);

        circle.textLabel = text;
        players[id] = circle;
        console.log(`Đã tạo nhân vật [${labelText}] cho ID:`, id);
    }

    function update() {
        if (!myId || !players[myId]) {
            if (socket.id && players[socket.id]) {
                myId = socket.id;
            }
            return;
        }

        const p = players[myId];
        let speed = 4;
        let moved = false;

        let keyMoved = false;
        if (cursors.left.isDown || wasd.left.isDown) { p.x -= speed; keyMoved = true; }
        else if (cursors.right.isDown || wasd.right.isDown) { p.x += speed; keyMoved = true; }

        if (cursors.up.isDown || wasd.up.isDown) { p.y -= speed; keyMoved = true; }
        else if (cursors.down.isDown || wasd.down.isDown) { p.y += speed; keyMoved = true; }

        if (keyMoved) {
            clickTarget = null; // Hủy lệnh click nếu bấm phím
            moved = true;
        } 
        else if (clickTarget !== null) {
            let dx = clickTarget.x - p.x;
            let dy = clickTarget.y - p.y;
            let dist = Math.sqrt(dx * dx + dy * dy);

            if (dist > speed) {
                let angle = Math.atan2(dy, dx);
                p.x += Math.cos(angle) * speed;
                p.y += Math.sin(angle) * speed;
                moved = true; // Đánh dấu đang trượt chuột từng bước
            } else {
                p.x = clickTarget.x;
                p.y = clickTarget.y;
                clickTarget = null; // Đã đến đích
                moved = true;
            }
        }

        // Cập nhật vị trí chữ "Bạn" theo hình tròn
        if (p.textLabel) {
            p.textLabel.x = p.x;
            p.textLabel.y = p.y - 25;
        }

        // QUAN TRỌNG: Gửi tọa độ liên tục lên server trong mỗi khung hình khi đang di chuyển (cả phím lẫn chuột)
        if (moved) {
            socket.emit('playerMovement', { x: p.x, y: p.y });
        }
    }
</script>
</body>
</html>
