<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>STU-Town</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #1a1a1a; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        canvas { border: 2px solid #ffffff22; border-radius: 8px; touch-action: none; cursor: pointer; }
    </style>
</head>
<body>

<script>
    const SERVER_URL = "https://stu-town-server.onrender.com";
    const socket = io(SERVER_URL);

    const config = {
        type: Phaser.AUTO,
        width: 800,
        height: 600,
        backgroundColor: '#2d2d2d',
        physics: {
            default: 'arcade',
            arcade: { debug: false }
        },
        scene: {
            preload: preload,
            create: create,
            update: update
        }
    };

    const game = new Phaser.Game(config);
    let players = {};
    let myPlayerId = null;
    let cursors;
    let wasd;
    let targetPosition = null;

    function preload() {}

    function create() {
        const self = this;

        // Bắt sự kiện bàn phím
        cursors = this.input.keyboard.createCursorKeys();
        wasd = this.input.keyboard.addKeys({
            up: Phaser.Input.Keyboard.KeyCodes.W,
            down: Phaser.Input.Keyboard.KeyCodes.S,
            left: Phaser.Input.Keyboard.KeyCodes.A,
            right: Phaser.Input.Keyboard.KeyCodes.D
        });

        // Lắng nghe sự kiện click/chạm trực tiếp từ DOM canvas để chắc chắn nhận diện tọa độ
        setTimeout(() => {
            const canvasEl = document.querySelector('canvas');
            if (canvasEl) {
                canvasEl.addEventListener('pointerdown', (event) => {
                    const rect = canvasEl.getBoundingClientRect();
                    // Tính toán tọa độ thực tế tương ứng với kích thước 800x600 của game
                    const scaleX = 800 / canvasEl.clientWidth;
                    const scaleY = 600 / canvasEl.clientHeight;
                    
                    targetPosition = {
                        x: (event.clientX - rect.left) * scaleX,
                        y: (event.clientY - rect.top) * scaleY
                    };
                });
            }
        }, 500);

        // Lắng nghe sự kiện từ Server
        socket.on('connect', () => {
            myPlayerId = socket.id;
        });

        socket.on('currentPlayers', (serverPlayers) => {
            Object.keys(serverPlayers).forEach((id) => {
                if (!players[id]) {
                    addPlayer(self, serverPlayers[id]);
                }
            });
        });

        socket.on('newPlayer', (playerInfo) => {
            if (!players[playerInfo.id]) {
                addPlayer(self, playerInfo);
            }
        });

        socket.on('playerMoved', (playerInfo) => {
            if (players[playerInfo.id]) {
                players[playerInfo.id].x = playerInfo.x;
                players[playerInfo.id].y = playerInfo.y;
            }
        });

        socket.on('playerDisconnected', (id) => {
            if (players[id]) {
                players[id].destroy();
                delete players[id];
            }
        });
    }

    function addPlayer(scene, playerInfo) {
        const circle = scene.add.circle(playerInfo.x, playerInfo.y, 12, 0xff5500);
        scene.physics.add.existing(circle);
        circle.body.setCollideWorldBounds(true);
        players[playerInfo.id] = circle;
    }

    function update() {
        if (!myPlayerId || !players[myPlayerId]) return;

        const myPlayer = players[myPlayerId];
        let speed = 4;
        let moved = false;

        // 1. Điều khiển bằng Bàn phím (WASD / Mũi tên) -> Ưu tiên ngắt mục tiêu chuột nếu dùng phím
        if (cursors.left.isDown || wasd.left.isDown) {
            myPlayer.x -= speed;
            moved = true;
            targetPosition = null; 
        } else if (cursors.right.isDown || wasd.right.isDown) {
            myPlayer.x += speed;
            moved = true;
            targetPosition = null;
        }

        if (cursors.up.isDown || wasd.up.isDown) {
            myPlayer.y -= speed;
            moved = true;
            targetPosition = null;
        } else if (cursors.down.isDown || wasd.down.isDown) {
            myPlayer.y += speed;
            moved = true;
            targetPosition = null;
        }

        // 2. Di chuyển tự động đến vị trí đã click/chạm
        if (targetPosition && !moved) {
            const distance = Phaser.Math.Distance.Between(myPlayer.x, myPlayer.y, targetPosition.x, targetPosition.y);

            if (distance > 4) {
                const angle = Phaser.Math.Angle.Between(myPlayer.x, myPlayer.y, targetPosition.x, targetPosition.y);
                myPlayer.x += Math.cos(angle) * speed;
                myPlayer.y += Math.sin(angle) * speed;
                moved = true;
            } else {
                targetPosition = null; // Đã tới đích
            }
        }

        // Gửi tọa độ mới lên Server
        if (moved) {
            socket.emit('playerMovement', { x: myPlayer.x, y: myPlayer.y });
        }
    }
</script>
</body>
</html>
