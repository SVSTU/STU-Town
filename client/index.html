<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STU-Town - Avatar & Chat</title>
    <!-- Thư viện Phaser và Socket.io -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <!-- Nhúng file CSS riêng -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="chat-container">
        <div id="avatar-section">
            <input type="file" id="avatar-input" accept="image/*">
            <button id="avatar-submit" onclick="applyAvatar()">Áp dụng</button>
        </div>

        <div id="chat-messages"></div>
        <form id="chat-form" onsubmit="sendChat(event)">
            <input type="text" id="chat-input" placeholder="Nhập tin nhắn..." autocomplete="off">
            <button type="submit" id="chat-submit">Gửi</button>
        </form>
    </div>

    <!-- Nhúng file Logic Game riêng -->
    <script src="game.js"></script>
</body>
</html>
