<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STU-Town - Avatar & Chat</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { margin: 0; background: #1a1a1a; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: Arial, sans-serif; }
        canvas { border: 2px solid #555; border-radius: 8px; cursor: pointer; }
        
        #chat-container {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 310px;
            background: rgba(0, 0, 0, 0.75);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            z-index: 10;
        }
        #avatar-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.1);
            padding: 6px;
            border-radius: 4px;
            font-size: 12px;
            color: #fff;
            gap: 5px;
        }
        #avatar-input {
            font-size: 11px;
            color: #fff;
            flex: 1;
        }
        #avatar-submit {
            padding: 4px 8px;
            background: #0088ff;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 11px;
        }
        #avatar-submit:hover { background: #0066cc; }

        #chat-messages {
            height: 100px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 13px;
            color: #fff;
            padding-right: 5px;
        }
        .chat-line {
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 8px;
            border-radius: 4px;
            word-break: break-word;
        }
        #chat-form {
            display: flex;
            gap: 5px;
        }
        #chat-input {
            flex: 1;
            padding: 6px;
            border: none;
            border-radius: 4px;
            outline: none;
            font-size: 13px;
        }
        #chat-submit {
            padding: 6px 12px;
            background: #00ff55;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        #chat-submit:hover { background: #00cc44; }
    </style>
</head>
<body>

    <div id="chat-container">
        <div id="avatar-section">
            <input type="file" id="avatar-input" accept="image/*">
            <button id="avatar-submit" onclick="applyAvatar()">Áp dụng</button>
        </div>

        <div id="chat-messages"></div>
        <form id="chat-form" onsubmit="sendChat(event)">
            <input type="text" id="chat-input" placeholder="Nhập tin nhắn..." autocomplete="off">
            <button type="submit" id="chat-submit">Gửi</button>
        </form>
    </div>

<script>
    console.log("GAME STARTING...");
    const socket = io("https://stu-town-server.onrender.com");

    let players = {};
    let targetPosition = null;
    let cursors;
    let sceneRef = null;

    const config = {
        type: Phaser.AUTO,
        width: 800,
        height: 600,
        backgroundColor: '#2d2d2d',
        scene: {
            preload: preload,
            create: create,
            update: update
        }
    };

    const game = new Phaser.Game(config);

    function preload() {}

    function create() {
        sceneRef = this;
        console.log("SCENE CREATED SUCCESSFULLY!");

        cursors = sceneRef.input.keyboard.createCursorKeys();

        const chatInput = document.getElementById('chat-input');
        chatInput.addEventListener('focus', () => {
            if (sceneRef && sceneRef.input && sceneRef.input.keyboard) {
                sceneRef.input.keyboard.enabled = false;
            }
        });
        chatInput.addEventListener('blur', () => {
            if (sceneRef && sceneRef.input && sceneRef.input.keyboard) {
                sceneRef.input.keyboard.enabled = true;
            }
        });
        chatInput.addEventListener('keydown', (e) => {
            e.stopPropagation();
        });

        sceneRef.input.on('pointerdown', (pointer) => {
            targetPosition = { x: pointer.x, y: pointer.y };
        });

        socket.on('connect', () => {
            console.log("Connected to server, my socket ID:", socket.id);
        });

        socket.on('currentPlayers', (serverPlayers) => {
            Object.keys(serverPlayers).forEach((id) => {
                if (!players[id]) {
                    createPlayer(sceneRef, serverPlayers[id], id);
                }
            });
        });

        socket.on('newPlayer', (playerInfo) => {
            if (!players[playerInfo.id]) {
                createPlayer(sceneRef, playerInfo, playerInfo.id);
            }
        });

        socket.on('playerMoved', (playerInfo) => {
            if (players[playerInfo.id] && playerInfo.id !== socket.id) {
                const p = players[playerInfo.id];
                p.x = playerInfo.x;
                p.y = playerInfo.y;
                updateLabels(p);
            }
        });

        socket.on('playerAvatarUpdated', (data) => {
            if (players[data.id]) {
                updatePlayerAvatar(sceneRef, players[data.id], data.avatar, data.id);
            }
        });

        socket.on('playerDisconnected', (id) => {
            if (players[id]) {
                if (players[id].textLabel) players[id].textLabel.destroy();
                if (players[id].chatBubble) players[id].chatBubble.destroy();
                players[id].destroy();
                delete players[id];
            }
        });

        socket.on('chatMessage', (data) => {
            const isMe = (data.id === socket.id);
            const shortId = data.id.substring(0, 4);
            const senderName = isMe ? "Bạn" : `Khách (${shortId})`;

            const now = new Date();
            const timeString = now.toTimeString().split(' ')[0];
            
            const chatMessages = document.getElementById('chat-messages');
            const line = document.createElement('div');
            line.className = 'chat-line';
            line.innerHTML = `<span style="color: #aaa; font-size: 11px;">[${timeString}]</span> <b>${senderName}:</b> ${data.message}`;
            chatMessages.appendChild(line);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            if (players[data.id]) {
                showChatBubble(sceneRef, players[data.id], data.message);
            }
        });
    }

    function createPlayer(scene, info, id) {
        if (!scene) return;
        if (players[id]) {
            if (players[id].textLabel) players[id].textLabel.destroy();
            if (players[id].chatBubble) players[id].chatBubble.destroy();
            players[id].destroy();
        }

        const isMe = (id === socket.id);
        const radius = isMe ? 18 : 15;

        const container = scene.add.container(info.x, info.y);

        // Vòng tròn nền dự phòng
        const bgCircle = scene.add.circle(0, 0, radius, isMe ? 0x00ff55 : 0xff5500);
        container.add(bgCircle);

        if (info.avatar) {
            setAvatarToContainer(scene, container, info.avatar, radius);
        }

        const shortId = id.substring(0, 4);
        const labelText = isMe ? "Bạn" : `Khách (${shortId})`;
        const text = scene.add.text(0, -28, labelText, {
            font: '13px Arial',
            fill: '#ffffff',
            backgroundColor: '#00000088',
            padding: { x: 4, y: 2 }
        }).setOrigin(0.5);

        container.textLabel = text;
        scene.add.existing(container);
        players[id] = container;
    }

    // Xử lý nạp ảnh trực tiếp vào texture của Phaser một cách chính xác
    function setAvatarToContainer(scene, container, base64Str, radius) {
        const textureKey = 'avatar_' + Math.random();
        const img = new Image();
        img.src = base64Str;
        img.onload = function() {
            if (scene.textures.exists(textureKey)) {
                scene.textures.remove(textureKey);
            }
            scene.textures.addImage(textureKey, img);

            if (container.avatarSprite) {
                container.avatarSprite.destroy();
            }

            const avatarSprite = scene.add.image(0, 0, textureKey);
            avatarSprite.setDisplaySize(radius * 2, radius * 2);

            // Tạo khung mặt nạ tròn bọc lấy ảnh
            const maskShape = scene.make.graphics();
            maskShape.fillStyle(0xffffff);
            maskShape.beginPath();
            maskShape.arc(0, 0, radius, 0, Math.PI * 2);
            maskShape.fillPath();

            const mask = new Phaser.Display.Masks.GeometryMask(scene, maskShape);
            avatarSprite.setMask(mask);

            container.add(avatarSprite);
            container.avatarSprite = avatarSprite;
        };
    }

    function updatePlayerAvatar(scene, container, base64Str, id) {
        const radius = (id === socket.id) ? 18 : 15;
        setAvatarToContainer(scene, container, base64Str, radius);
    }

    function applyAvatar() {
        const fileInput = document.getElementById('avatar-input');
        const file = fileInput.files[0];
        if (!file) {
            alert("Vui lòng chọn một tệp ảnh trước khi bấm Áp dụng!");
            return;
        }

        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.src = e.target.result;
            img.onload = function() {
                // Nén ảnh gọn về kích thước 60x60 pixels
                const canvas = document.createElement('canvas');
                canvas.width = 60;
                canvas.height = 60;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, 60, 60);
                
                const compressedBase64 = canvas.toDataURL('image/png');

                // Cập nhật cho chính mình
                if (sceneRef && players[socket.id]) {
                    updatePlayerAvatar(sceneRef, players[socket.id], compressedBase64, socket.id);
                }

                // Gửi lên server để đồng bộ sang người khác
                socket.emit('updateAvatar', compressedBase64);
                console.log("Đã nén và áp dụng Avatar thành công!");
            };
        };
        reader.readAsDataURL(file);
    }

    function updateLabels(p) {
        if (p.textLabel) {
            p.textLabel.x = 0;
            p.textLabel.y = -28;
        }
        if (p.chatBubble) {
            p.chatBubble.x = 0;
            p.chatBubble.y = -55;
        }
    }

    function showChatBubble(scene, playerObj, message) {
        if (!scene) return;
        if (playerObj.chatBubble) {
            playerObj.chatBubble.destroy();
        }

        const bubble = scene.add.text(0, -55, message, {
            font: '12px Arial',
            fill: '#000',
            backgroundColor: '#ffffff',
            padding: { x: 6, y: 4 },
            align: 'center'
        }).setOrigin(0.5);

        playerObj.chatBubble = bubble;
        playerObj.add(bubble);

        scene.time.delayedCall(4000, () => {
            if (playerObj.chatBubble === bubble) {
                bubble.destroy();
                playerObj.chatBubble = null;
            }
        });
    }

    function sendChat(event) {
        event.preventDefault();
        const input = document.getElementById('chat-input');
        const text = input.value.trim();
        if (text !== "") {
            socket.emit('sendChatMessage', text);
            input.value = "";
        }
    }

    function update() {
        if (!socket.id || !players[socket.id]) return;

        const p = players[socket.id];
        let speed = 4;
        let isMoved = false;

        let keyActive = false;
        if (cursors.left.isDown) { p.x -= speed; keyActive = true; }
        else if (cursors.right.isDown) { p.x += speed; keyActive = true; }

        if (cursors.up.isDown) { p.y -= speed; keyActive = true; }
        else if (cursors.down.isDown) { p.y += speed; keyActive = true; }

        if (keyActive) {
            targetPosition = null;
            isMoved = true;
        } 
        else if (targetPosition !== null) {
            let dx = targetPosition.x - p.x;
            let dy = targetPosition.y - p.y;
            let distance = Math.sqrt(dx * dx + dy * dy);

            if (distance > speed) {
                let angle = Math.atan2(dy, dx);
                p.x += Math.cos(angle) * speed;
                p.y += Math.sin(angle) * speed;
                isMoved = true;
            } else {
                p.x = targetPosition.x;
                p.y = targetPosition.y;
                targetPosition = null;
                isMoved = true;
            }
        }

        if (isMoved) {
            socket.emit('playerMovement', { x: p.x, y: p.y });
        }
    }
</script>
</body>
</html>
