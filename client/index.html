<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STU Town - Không Gian 2D</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    body { margin: 0; padding: 0; background-color: #1a1a1a; display: flex; justify-content: center; align-items: center; height: 100vh; }
  </style>
</head>
<body>
<script>
  // Tạm thời để localhost, sau khi đưa lên Render chúng ta sẽ đổi thành link Render
  const SERVER_URL = "http://localhost:3000"; 

  const config = {
    type: Phaser.AUTO,
    width: 800,
    height: 600,
    physics: { default: 'arcade', arcade: { debug: false } },
    scene: { preload: preload, create: create, update: update }
  };

  const game = new Phaser.Game(config);
  let socket, otherPlayers = {}, cursors, mySprite;

  function preload() {
    this.load.image('player', 'https://labs.phaser.io/assets/sprites/red_ball.png');
    this.load.image('otherPlayer', 'https://labs.phaser.io/assets/sprites/blue_ball.png');
  }

  function create() {
    const self = this;
    otherPlayers = this.add.group();
    cursors = this.input.keyboard.createCursorKeys();

    socket = io(SERVER_URL);

    socket.on('currentPlayers', (players) => {
      Object.keys(players).forEach((id) => {
        if (id === socket.id) {
          addPlayer(self, players[id]);
        } else {
          addOtherPlayers(self, { id: id, x: players[id].x, y: players[id].y });
        }
      });
    });

    socket.on('newPlayer', (playerInfo) => {
      addOtherPlayers(self, playerInfo);
    });

    socket.on('playerMoved', (playerInfo) => {
      otherPlayers.getChildren().forEach((otherPlayer) => {
        if (playerInfo.id === otherPlayer.playerId) {
          otherPlayer.setPosition(playerInfo.x, playerInfo.y);
        }
      });
    });

    socket.on('playerDisconnected', (playerId) => {
      otherPlayers.getChildren().forEach((otherPlayer) => {
        if (playerId === otherPlayer.playerId) {
          otherPlayer.destroy();
        }
      });
    });
  }

  function addPlayer(scene, info) {
    mySprite = scene.add.sprite(info.x, info.y, 'player').setScale(0.8);
  }

  function addOtherPlayers(scene, info) {
    const other = scene.add.sprite(info.x, info.y, 'otherPlayer').setScale(0.8);
    other.playerId = info.id;
    otherPlayers.add(other);
  }

  function update() {
    if (!mySprite) return;

    let moved = false;
    const speed = 4;

    if (cursors.left.isDown) { mySprite.x -= speed; moved = true; }
    else if (cursors.right.isDown) { mySprite.x += speed; moved = true; }
    if (cursors.up.isDown) { mySprite.y -= speed; moved = true; }
    else if (cursors.down.isDown) { mySprite.y += speed; moved = true; }

    if (moved) {
      socket.emit('playerInput', { x: mySprite.x, y: mySprite.y });
    }
  }
</script>
</body>
</html>
