<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STU-Town</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { margin: 0; background: #1a1a1a; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        canvas { border: 2px solid #555; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
<script>
    console.log("GAME STARTING...");
    const socket = io("https://stu-town-server.onrender.com");

    let players = {};
    let myId = null;
    let targetX = null;
    let targetY = null;
    let cursors, wasd;

    const config = {
        type: Phaser.AUTO,
        width: 800,
        height: 600,
        backgroundColor: '#2d2d2d',
        scene: { preload: preload, create: create, update: update }
    };

    const game = new Phaser.Game(config);

    function preload() {}

    function create() {
        const scene = this;
        console.log("SCENE CREATED SUCCESSFULLY!");

        cursors = scene.input.keyboard.createCursorKeys();
        wasd = scene.input.keyboard.addKeys({
            up: Phaser.Input.Keyboard.KeyCodes.W,
            down: Phaser.Input.Keyboard.KeyCodes.S,
            left: Phaser.Input.Keyboard.KeyCodes.A,
            right: Phaser.Input.Keyboard.KeyCodes.D
        });

        // Bắt sự kiện click chuột
        scene.input.on('pointerdown', (pointer) => {
            targetX = pointer.x;
            targetY = pointer.y;
            console.log("Clicked at:", targetX, targetY);
        });

        socket.on('connect', () => {
            myId = socket.id;
            console.log("Connected to server, my ID:", myId);
        });

        socket.on('currentPlayers', (serverPlayers) => {
            Object.keys(serverPlayers).forEach((id) => {
                if (!players[id]) createPlayer(scene, serverPlayers[id]);
            });
        });

        socket.on('newPlayer', (playerInfo) => {
            if (!players[playerInfo.id]) createPlayer(scene, playerInfo);
        });

        socket.on('playerMoved', (playerInfo) => {
            if (players[playerInfo.id] && playerInfo.id !== myId) {
                players[playerInfo.id].x = playerInfo.x;
                players[playerInfo.id].y = playerInfo.y;
            }
        });

        socket.on('playerDisconnected', (id) => {
            if (players[id]) {
                players[id].destroy();
                delete players[id];
            }
        });
    }

    function createPlayer(scene, info) {
        const circle = scene.add.circle(info.x, info.y, 12, 0xff5500);
        players[info.id] = circle;
        console.log("Created player circle for:", info.id);
    }

    function update() {
        if (!myId || !players[myId]) return;

        const p = players[myId];
        let speed = 4;
        let moved = false;

        let keyMoved = false;
        if (cursors.left.isDown || wasd.left.isDown) { p.x -= speed; keyMoved = true; }
        else if (cursors.right.isDown || wasd.right.isDown) { p.x += speed; keyMoved = true; }

        if (cursors.up.isDown || wasd.up.isDown) { p.y -= speed; keyMoved = true; }
        else if (cursors.down.isDown || wasd.down.isDown) { p.y += speed; keyMoved = true; }

        if (keyMoved) {
            targetX = null;
            targetY = null;
            moved = true;
        } else if (targetX !== null && targetY !== null) {
            let dx = targetX - p.x;
            let dy = targetY - p.y;
            let dist = Math.sqrt(dx * dx + dy * dy);

            if (dist > speed) {
                let angle = Math.atan2(dy, dx);
                p.x += Math.cos(angle) * speed;
                p.y += Math.sin(angle) * speed;
                moved = true;
            } else {
                p.x = targetX;
                p.y = targetY;
                targetX = null;
                targetY = null;
                moved = true;
            }
        }

        if (moved) {
            socket.emit('playerMovement', { x: p.x, y: p.y });
        }
    }
</script>
</body>
</html>
