<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STU-Town</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { margin: 0; background: #1a1a1a; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        canvas { border: 2px solid #555; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
<script>
    console.log("GAME STARTING...");
    const socket = io("https://stu-town-server.onrender.com");

    let players = {};
    let myId = null;
    let clickTarget = null;
    let cursors, wasd;

    const config = {
        type: Phaser.AUTO,
        width: 800,
        height: 600,
        backgroundColor: '#2d2d2d',
        scene: { preload: preload, create: create, update: update }
    };

    const game = new Phaser.Game(config);

    function preload() {}

    function create() {
        const scene = this;
        console.log("SCENE CREATED SUCCESSFULLY!");

        cursors = scene.input.keyboard.createCursorKeys();
        wasd = scene.input.keyboard.addKeys({
            up: Phaser.Input.Keyboard.KeyCodes.W,
            down: Phaser.Input.Keyboard.KeyCodes.S,
            left: Phaser.Input.Keyboard.KeyCodes.A,
            right: Phaser.Input.Keyboard.KeyCodes.D
        });

        scene.input.on('pointerdown', (pointer) => {
            clickTarget = { x: pointer.x, y: pointer.y };
        });

        socket.on('connect', () => {
            myId = socket.id;
            console.log("Connected to server, my ID:", myId);
        });

        socket.on('currentPlayers', (serverPlayers) => {
            Object.keys(serverPlayers).forEach((id) => {
                if (!players[id]) createPlayer(scene, serverPlayers[id], id);
            });
        });

        socket.on('newPlayer', (playerInfo) => {
            if (!players[playerInfo.id]) createPlayer(scene, playerInfo, playerInfo.id);
        });

        socket.on('playerMoved', (playerInfo) => {
            if (players[playerInfo.id]) {
                // Cập nhật vị trí hình tròn và cả chữ tên đi kèm
                players[playerInfo.id].container.x = playerInfo.x;
                players[playerInfo.id].container.y = playerInfo.y;
            }
        });

        socket.on('playerDisconnected', (id) => {
            if (players[id]) {
                players[id].container.destroy();
                delete players[id];
            }
        });
    }

    function createPlayer(scene, info, id) {
        const isMe = (id === myId);

        // Phân biệt màu sắc và kích thước:
        // - Của bạn: Màu Xanh lá (0x00ff55), bán kính 15
        // - Người khác: Màu Cam (0xff5500), bán kính 12
        const color = isMe ? 0x00ff55 : 0xff5500;
        const radius = isMe ? 15 : 12;

        const circle = scene.add.circle(0, 0, radius, color);
        
        // Thêm chữ hiển thị (Bạn / Khách)
        const labelText = isMe ? "Bạn" : "Khách";
        const text = scene.add.text(0, -25, labelText, {
            font: '14px Arial',
            fill: '#ffffff',
            backgroundColor: '#00000088',
            padding: { x: 4, y: 2 }
        }).setOrigin(0.5);

        // Gom hình tròn và chữ vào chung một Container để dịch chuyển cùng nhau
        const container = scene.add.container(info.x, info.y, [circle, text]);

        players[id] = {
            container: container,
            isMe: isMe
        };
    }

    function update() {
        if (!myId || !players[myId]) return;

        // Nếu lúc đầu kết nối chưa gán đúng myId cho container của mình, cập nhật lại tại đây
        if (!players[myId].isMe) {
            // Tự động làm mới nếu tìm thấy container của chính mình
        }

        const myContainer = players[myId].container;
        let speed = 4;
        let moved = false;

        let keyMoved = false;
        if (cursors.left.isDown || wasd.left.isDown) { myContainer.x -= speed; keyMoved = true; }
        else if (cursors.right.isDown || wasd.right.isDown) { myContainer.x += speed; keyMoved = true; }

        if (cursors.up.isDown || wasd.up.isDown) { myContainer.y -= speed; keyMoved = true; }
        else if (cursors.down.isDown || wasd.down.isDown) { myContainer.y += speed; keyMoved = true; }

        if (keyMoved) {
            clickTarget = null;
            moved = true;
        } 
        else if (clickTarget !== null) {
            let dx = clickTarget.x - myContainer.x;
            let dy = clickTarget.y - myContainer.y;
            let dist = Math.sqrt(dx * dx + dy * dy);

            if (dist > speed) {
                let angle = Math.atan2(dy, dx);
                myContainer.x += Math.cos(angle) * speed;
                myContainer.y += Math.sin(angle) * speed;
                moved = true;
            } else {
                myContainer.x = clickTarget.x;
                myContainer.y = clickTarget.y;
                clickTarget = null;
                moved = true;
            }
        }

        if (moved) {
            socket.emit('playerMovement', { x: myContainer.x, y: myContainer.y });
        }
    }
</script>
</body>
</html>
