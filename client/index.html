<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STU-Town</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { margin: 0; background: #1a1a1a; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        canvas { border: 2px solid #555; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
<script>
    console.log("GAME STARTING...");
    const socket = io("https://stu-town-server.onrender.com");

    let players = {};
    let myId = null;
    let targetPosition = null;
    let cursors, wasd;

    const config = {
        type: Phaser.AUTO,
        width: 800,
        height: 600,
        backgroundColor: '#2d2d2d',
        scene: { preload: preload, create: create, update: update }
    };

    const game = new Phaser.Game(config);

    function preload() {}

    function create() {
        const scene = this;
        console.log("SCENE CREATED SUCCESSFULLY!");

        cursors = scene.input.keyboard.createCursorKeys();
        wasd = scene.input.keyboard.addKeys({
            up: Phaser.Input.Keyboard.KeyCodes.W,
            down: Phaser.Input.Keyboard.KeyCodes.S,
            left: Phaser.Input.Keyboard.KeyCodes.A,
            right: Phaser.Input.Keyboard.KeyCodes.D
        });

        // Bắt sự kiện click chuột trên toàn khung game
        scene.input.on('pointerdown', (pointer) => {
            targetPosition = { x: pointer.x, y: pointer.y };
        });

        socket.on('connect', () => {
            myId = socket.id;
            console.log("Connected to server, my ID:", myId);
        });

        socket.on('currentPlayers', (serverPlayers) => {
            Object.keys(serverPlayers).forEach((id) => {
                if (!players[id]) {
                    createPlayer(scene, serverPlayers[id], id);
                }
            });
        });

        socket.on('newPlayer', (playerInfo) => {
            if (!players[playerInfo.id]) {
                createPlayer(scene, playerInfo, playerInfo.id);
            }
        });

        // Lắng nghe người chơi khác di chuyển từ server
        socket.on('playerMoved', (playerInfo) => {
            if (players[playerInfo.id] && playerInfo.id !== socket.id) {
                const p = players[playerInfo.id];
                p.x = playerInfo.x;
                p.y = playerInfo.y;
                if (p.textLabel) {
                    p.textLabel.x = playerInfo.x;
                    p.textLabel.y = playerInfo.y - 25;
                }
            }
        });

        socket.on('playerDisconnected', (id) => {
            if (players[id]) {
                if (players[id].textLabel) players[id].textLabel.destroy();
                players[id].destroy();
                delete players[id];
            }
        });
    }

    function createPlayer(scene, info, id) {
        const isMe = (id === socket.id);
        const color = isMe ? 0x00ff55 : 0xff5500;
        const radius = isMe ? 15 : 12;

        const circle = scene.add.circle(info.x, info.y, radius, color);
        
        const labelText = isMe ? "Bạn" : "Khách";
        const text = scene.add.text(info.x, info.y - 25, labelText, {
            font: '14px Arial',
            fill: '#ffffff',
            backgroundColor: '#00000088',
            padding: { x: 4, y: 2 }
        }).setOrigin(0.5);

        circle.textLabel = text;
        players[id] = circle;
    }

    function update() {
        // Đảm bảo lấy đúng ID hiện tại của chính mình
        if (!myId && socket.id) {
            myId = socket.id;
        }
        if (!myId || !players[myId]) return;

        const p = players[myId];
        let speed = 4;
        let isMoved = false;

        // 1. Điều khiển bằng bàn phím (WASD / Mũi tên)
        let keyActive = false;
        if (cursors.left.isDown || wasd.left.isDown) { p.x -= speed; keyActive = true; }
        else if (cursors.right.isDown || wasd.right.isDown) { p.x += speed; keyActive = true; }

        if (cursors.up.isDown || wasd.up.isDown) { p.y -= speed; keyActive = true; }
        else if (cursors.down.isDown || wasd.down.isDown) { p.y += speed; keyActive = true; }

        if (keyActive) {
            targetPosition = null; // Hủy điểm click nếu đang dùng phím
            isMoved = true;
        } 
        // 2. Điều khiển bằng Click chuột / Chạm màn hình (Tự động trượt mượt mà)
        else if (targetPosition !== null) {
            let dx = targetPosition.x - p.x;
            let dy = targetPosition.y - p.y;
            let distance = Math.sqrt(dx * dx + dy * dy);

            if (distance > speed) {
                let angle = Math.atan2(dy, dx);
                p.x += Math.cos(angle) * speed;
                p.y += Math.sin(angle) * speed;
                isMoved = true;
            } else {
                p.x = targetPosition.x;
                p.y = targetPosition.y;
                targetPosition = null; // Đã đến đích
                isMoved = true;
            }
        }

        // Cập nhật vị trí nhãn tên "Bạn"
        if (p.textLabel) {
            p.textLabel.x = p.x;
            p.textLabel.y = p.y - 25;
        }

        // Bắn tọa độ liên tục lên server khi nhân vật thay đổi vị trí
        if (isMoved) {
            socket.emit('playerMovement', { x: p.x, y: p.y });
        }
    }
</script>
</body>
</html>
