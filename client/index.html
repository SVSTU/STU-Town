<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STU-Town - Avatar & Chat</title>
    <!-- Thư viện Phaser và Socket.io -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <!-- Nhúng file CSS riêng -->
    <link rel="stylesheet" href="style.css?v=20261028-private-sender">
</head>
<body>

    <div id="chat-container">
        <div id="chat-header">
            <strong>STU-Town</strong>
            <div id="chat-header-actions">
                <button id="settings-toggle" type="button" aria-label="Mở cài đặt hồ sơ" aria-expanded="false">⚙</button>
                <button id="chat-toggle" type="button" aria-label="Thu nhỏ khung chat" aria-expanded="true">−</button>
            </div>
        </div>

        <div id="chat-content">
        <section id="settings-panel" aria-label="Cài đặt hồ sơ">
            <form id="profile-form" onsubmit="saveProfile(event)">
                <strong>Thông tin cá nhân</strong>
                <input type="text" id="nickname-input" maxlength="24" placeholder="Nickname" aria-label="Nickname">
                <input type="file" id="avatar-input" accept="image/png,image/jpeg,image/webp,image/gif" aria-label="Chọn avatar">
                <button type="submit" id="profile-submit">Lưu hồ sơ</button>
            </form>
        </section>
        <div id="chat-mode-switch" role="tablist" aria-label="Loại cuộc trò chuyện">
            <button type="button" id="group-mode-button" class="is-active" role="tab" aria-selected="true">Phòng chung</button>
            <button type="button" id="private-mode-button" role="tab" aria-selected="false">Riêng tư <span id="private-unread" hidden></span></button>
        </div>
        <div id="quick-emotes" role="group" aria-label="Thả biểu cảm nhanh">
            <span>Biểu cảm:</span>
            <button type="button" data-player-emote="👋" aria-label="Thả xin chào lên trên đầu nhân vật" title="Xin chào">👋</button>
            <button type="button" data-player-emote="❤️" aria-label="Thả trái tim lên trên đầu nhân vật" title="Trái tim">❤️</button>
            <button type="button" data-player-emote="😂" aria-label="Thả tiếng cười lên trên đầu nhân vật" title="Cười">😂</button>
            <button type="button" data-player-emote="👍" aria-label="Thả thích lên trên đầu nhân vật" title="Thích">👍</button>
            <button type="button" data-player-emote="🔥" aria-label="Thả lửa lên trên đầu nhân vật" title="Tuyệt vời">🔥</button>
            <button type="button" data-player-emote="🎉" aria-label="Thả pháo giấy lên trên đầu nhân vật" title="Chúc mừng">🎉</button>
        </div>
        <section id="group-chat-view" class="chat-mode-view" role="tabpanel">
        <div id="chat-messages"></div>
        <div id="emoji-picker" aria-label="Chọn emoji">
            <button type="button" data-emoji="😀">😀</button>
            <button type="button" data-emoji="😂">😂</button>
            <button type="button" data-emoji="❤️">❤️</button>
            <button type="button" data-emoji="👍">👍</button>
            <button type="button" data-emoji="🎉">🎉</button>
        </div>
        <form id="chat-form" onsubmit="sendChat(event)">
            <input type="text" id="chat-input" placeholder="Nhập tin nhắn..." autocomplete="off">
            <button type="button" id="emoji-toggle" aria-label="Mở emoji">😊</button>
            <button type="submit" id="chat-submit">Gửi</button>
        </form>
        </section>
        <section id="private-chat-view" class="chat-mode-view" role="tabpanel" hidden>
            <select id="private-recipient" aria-label="Chọn người để nhắn riêng">
                <option value="">Chọn người chơi đang online</option>
            </select>
            <div id="private-conversation-title">Chưa chọn người nhận</div>
            <div id="private-status" role="status">Chọn một người chơi để bắt đầu chat riêng.</div>
            <div id="private-messages" aria-live="polite"></div>
            <form id="private-chat-form" onsubmit="sendPrivateMessage(event)">
                <input type="text" id="private-chat-input" maxlength="300" placeholder="Nhắn tin riêng..." autocomplete="off">
                <button type="submit">Gửi</button>
            </form>
        </section>
        </div>
    </div>

    <!-- Nhúng file Logic Game riêng -->
    <script src="game.js?v=20261028-floating-emotes"></script>
</body>
</html>
